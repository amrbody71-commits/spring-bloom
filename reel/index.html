<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, height=640">
<title>Spring Bloom reel</title>
<!-- The reel is the site itself in capture mode, driven by tour.json. The
     GSAP timeline carries no tweens: it exists so HyperFrames has a duration
     and a seek target; each seek is forwarded to the app, which steps its own
     clock to that time. Audio is placed here as ordinary timed media so the
     renderer mixes it; the app plays no sound in capture mode. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/labels.css">
<link rel="stylesheet" href="css/ui.css">
<style>
  html, body { margin: 0; background: #0b0908; }
  #root { position: relative; width: 360px; height: 640px; overflow: hidden; background: #d9cdb0; }
  /* the app lays itself out against the viewport; pin it to the root box */
  #stage { position: absolute; inset: 0; width: 360px; height: 640px; display: block; }
  #ui, #cards, #capture { position: absolute; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="360" data-height="640" data-duration="72">
  <canvas id="stage" aria-label="Spring Bloom, a pop-up picture book"></canvas>
  <div id="ui"></div>
  <div id="cards"></div>

  <!-- narration, at the tour's read times; each take is cut where the tour moves on -->

  <audio id="vo-08" src="assets/audio/spread-08.mp3" data-start="54.0" data-duration="3.8" data-track-index="20" data-volume="1"></audio>

  <!-- effects -->

  <audio id="sfx-turn-4" src="assets/sfx/page-turn.mp3" data-start="21.8" data-track-index="11" data-volume="0.9"></audio>
  <audio id="sfx-turn-5" src="assets/sfx/page-turn.mp3" data-start="34.15" data-track-index="11" data-volume="0.9"></audio>
  <audio id="sfx-turn-6" src="assets/sfx/page-turn.mp3" data-start="45.15" data-track-index="11" data-volume="0.9"></audio>
  <audio id="sfx-turn-7" src="assets/sfx/page-turn.mp3" data-start="51.1" data-track-index="11" data-volume="0.9"></audio>
  <audio id="sfx-turn-8" src="assets/sfx/page-turn.mp3" data-start="52.6" data-track-index="12" data-volume="0.9"></audio>

  <audio id="amb-6" src="assets/sfx/ambience.mp3" data-start="67.5" data-duration="4.5" data-track-index="17" data-volume="0.3"></audio>
  <audio id="bed" src="assets/bed/bed.mp3" data-start="0" data-duration="72" data-track-index="18" data-volume="0.14"></audio>
</div>

<script type="module">
  import { boot } from './js/app.js';
  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: 72, ease: 'none' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;

  const canvas = document.getElementById('stage');
  const api = boot({ canvas, params: new URLSearchParams('capture&fps=30&tour=tour.json&seed=7&w=360&h=640&dpr=3') });
  window.__book = api;

  /* Every seek reaches the app twice at most (hf-seek and the timeline's
     own update); the second is a no-op because the clock is already there. */
  tl.eventCallback('onUpdate', () => api.renderAt(tl.time()));
  api.tourReady.then(() => api.renderAt(tl.time()));
</script>
</body>
</html>
